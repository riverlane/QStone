name: Pylint Static Analysis and Tests
permissions:
  contents: read
  pull-requests: write

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  pull_request:
    branches: [main, v.*, feat*]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pytest_multiplatform:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: Setting up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenMPI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin openmpi-doc libopenmpi-dev
      - name: Install OpenMPI dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install open-mpi
      - name: Installing dependencies
        run: pip install -U tox tox-uv
      - name: Testing
        run: tox -r -e pytest-all-mpi
      
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenMPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin openmpi-doc libopenmpi-dev
      - name: Installing dependencies
        run: pip install -U tox tox-uv
      - name: Running pylint
        run: tox -r -e pylint -- --output-format text:pylint.log,text

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenMPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin openmpi-doc libopenmpi-dev
      - name: Installing dependencies
        run: pip install -U tox tox-uv
      - name: Running mypy
        run: tox -r -e mypy -- --junit-xml mypy.xml

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenMPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin openmpi-doc libopenmpi-dev
      - name: Installing dependencies
        run: pip install -U tox tox-uv
      - name: Running black
        run: tox -e black -- --check --color --diff

  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installing dependencies
        run: pip install -U tox tox-uv
      - name: Running isortcheck
        run: tox -e isort -- --check-only --diff

  wheel:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv lock --check
      - run: uv build
      # The CLI skips missing templates silently, so check the wheel contents directly
      - name: Check the wheel contains every tracked package file
        run: |
          missing=$(comm -23 <(git ls-files qstone | sort) <(unzip -Z1 dist/qstone-*.whl | sort))
          if [ -n "$missing" ]; then echo "Missing from wheel:"; echo "$missing"; exit 1; fi
      # Install the wheel with plain pip in a clean venv, as users would
      - run: python3 -m venv /tmp/wheel-venv
      - run: /tmp/wheel-venv/bin/pip install dist/qstone-*.whl
      # Run outside the checkout so the installed package is used, not ./qstone
      - name: Smoke-test the installed package and CLI
        working-directory: ${{ runner.temp }}
        run: |
          /tmp/wheel-venv/bin/python -I -c "import qstone; assert 'site-packages' in qstone.__file__, qstone.__file__"
          /tmp/wheel-venv/bin/python -I -m qstone --help
          /tmp/wheel-venv/bin/qstone --help
          mkdir qstone-out
          /tmp/wheel-venv/bin/qstone generate -i "$GITHUB_WORKSPACE/tests/data/generator/config_single.json" -o qstone-out -n 3 -s bare_metal
          tar tzf qstone-out/bare_metal_user0.qstone.tar.gz | grep qstone_suite/type_exec_VQE.sh
