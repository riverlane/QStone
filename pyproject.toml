[project]
name = "qstone"
version = "0.4.1"
description = "Benchmarking suite for Quantum Computers integration into HPC Systems"
readme = "README.md"
authors = [{ name = "Riverlane", email = "team@riverlane.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["Quantum", "HPC"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11,<3.15"
dependencies = [
  "click",
  "cryptography>=44.0.1",
  "flask",
  "grpcio",
  "jinja2",
  "json5",
  "jsonschema",
  "matplotlib",
  "numpy>=1.22",
  "pandas-stubs",
  "pandera>=0.24.0",
  "protobuf",
  "pyGSTi>=0.9.13",
  "PyMatching>=2.2.1",
  # pyquil and quil do not support Python >= 3.13; the Rigetti connector is unavailable there.
  # pyquil >= 4.18 pulls in jax.
  "pyquil<4.18; python_version < '3.13'",
  "qcs-sdk-python>=0.21.12; python_version < '3.13'",
  "requests",
  "simple_slurm",
  "stim>=1.14.0",
  "waiting",
]

[project.optional-dependencies]
mpi = ["mpi4py"]

[project.urls]
repository = "https://github.com/riverlane/QStone"
documentation = "https://riverlane.github.io/QStone"
changelog = "https://github.com/riverlane/QStone/blob/main/CHANGELOG.md"

[project.scripts]
qstone = "qstone.__main__:main"

[dependency-groups]
test = [
  "grpcio-tools",
  "pytest",
  "pytest-cov",
  "pytest-depends",
  "pytest-manual-marker",
  "pytest-mock",
  "requests-mock",
  "types-protobuf",
]
lint = ["black", "isort", "mypy", "pylint"]
security = ["bandit", "ochrona", "pip-audit"]
docs = ["nbsphinx", "sphinx", "sphinx-copybutton", "sphinx-mdinclude", "sphinx_rtd_theme"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "security" },
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = ""
source-include = ["CHANGELOG.md"]

[tool.pylint.MASTER]
ignore-paths = 'qstone/connectors/riverlane/grpc.*$'

[tool.pylint."MESSAGES CONTROL"]
disable = """
    line-too-long,
    duplicate-code,
    too-many-locals,
    too-many-arguments,
    too-few-public-methods,
    too-many-instance-attributes
"""

[tool.coverage.run]
omit = [
    "qstone/utils/config_schema.py",
]

[tool.mypy]
exclude = "(qstone/connectors/riverlane/grpc.*$)|(qstone/generators/slurm/schedmd)|(tests)|(my_venv)"
